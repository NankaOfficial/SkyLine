<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Gaming site with lots of games being added later!">
<title>SkyLine</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;background:#050508;color:#f1f1f3;height:100vh;width:100vw;position:relative;user-select:none;-webkit-user-select:none}
#starfield{position:absolute;inset:0;z-index:0;pointer-events:none;background:#050508}
.navbar{position:relative;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1.25rem 2rem;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(5,5,8,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
@media(min-width:768px){.navbar{padding:1.5rem 3rem}}
.nav-left{justify-self:start;display:flex;align-items:center}
.nav-links{justify-self:center;display:flex;gap:.5rem;align-items:center}
.nav-right{justify-self:end;display:flex;align-items:center;gap:.5rem}
.icon-btn{background:none;border:none;cursor:pointer;color:#9494a0;display:flex;align-items:center;justify-content:center;padding:.4rem;border-radius:8px;transition:color .2s,background .2s}
.icon-btn:hover{color:#fff;background:rgba(255,255,255,.05)}
.icon-btn.active{color:#64b5f6;background:rgba(255,255,255,.05)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glow-title{font-weight:800;font-size:1.35rem;letter-spacing:.18em;text-transform:uppercase;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}
.nav-item{display:flex;align-items:center;gap:.5rem;color:#9494a0;text-decoration:none;font-size:.9rem;font-weight:500;letter-spacing:.05em;padding:.5rem 1rem;border-radius:8px;transition:color .2s,background .2s;cursor:pointer}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover,.nav-item.active{color:#fff;background:rgba(255,255,255,.05)}
.announcement-bar{position:relative;z-index:10;height:36px;background:rgba(12,12,18,.8);border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#b0b0bc;visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s}
.announcement-bar.visible{visibility:visible;opacity:1}
.event-stack{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-height:70vh;overflow-y:auto}
.event-card{background:rgba(12,12,18,.95);border:1px solid rgba(100,181,246,.4);border-left:4px solid #64b5f6;padding:.75rem 1.25rem;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.5);backdrop-filter:blur(12px);color:#fff;font-size:.85rem;animation:slideInRight .3s cubic-bezier(.16,1,.3,1) forwards;pointer-events:auto;min-width:240px;display:flex;flex-direction:column;gap:.2rem;position:relative}
.event-card .title{font-weight:600;color:#64b5f6;text-transform:uppercase;font-size:.75rem;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
@keyframes slideInRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.owner-badge{background:linear-gradient(135deg,#c8ffd9,#7dffb0);color:#050508;padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:6px;vertical-align:middle;box-shadow:0 0 10px rgba(125,255,176,.5)}
.admin-badge{background:linear-gradient(135deg,#9be3ff,#64b5f6);color:#050508;padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:6px;vertical-align:middle;box-shadow:0 0 10px rgba(130,210,255,.5)}
.name-owner{color:#9dffc2 !important}
.name-admin{color:#9be3ff !important}
.content-viewport{position:relative;z-index:10;width:100%;height:calc(100vh - 110px);display:flex;align-items:center;justify-content:center;padding:2rem;pointer-events:none;overflow-y:auto}
.page-container{pointer-events:auto;background:rgba(12,12,18,.85);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:2.5rem;width:100%;max-width:950px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,.6);backdrop-filter:blur(16px);overflow:hidden}
@keyframes slideUp{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.animate-slide-up{animation:slideUp .5s cubic-bezier(.16,1,.3,1) forwards}
.animate-fade-in{animation:fadeIn .4s ease-in-out forwards}
.page-title{font-size:1.8rem;font-weight:700;margin-bottom:.5rem;letter-spacing:-.01em;color:#fff}
.page-desc{color:#9494a0;font-size:.95rem;line-height:1.6;margin-bottom:1.5rem}
.search-container{position:relative;margin-bottom:1.5rem}
.search-input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:.75rem 1rem .75rem 2.5rem;color:#fff;font-size:.9rem;outline:none;transition:border-color .2s,background .2s;user-select:text;-webkit-user-select:text}
.search-input:focus{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05)}
.search-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#727280;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:max-content;align-content:start;gap:1.25rem;overflow-y:auto;padding-right:.25rem;flex:1 1 auto;min-height:0}
.games-grid::-webkit-scrollbar,.quick-grid::-webkit-scrollbar,#leaderboardList::-webkit-scrollbar,.chat-messages::-webkit-scrollbar{width:6px}
.games-grid::-webkit-scrollbar-thumb,.quick-grid::-webkit-scrollbar-thumb,#leaderboardList::-webkit-scrollbar-thumb,.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.game-card{flex-shrink:0;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,background .2s;display:flex;flex-direction:column}
.game-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.game-img-container{width:100%;aspect-ratio:16/10;background:rgba(0,0,0,.4);overflow:hidden;display:flex;align-items:center;justify-content:center}
.game-img-container img{width:100%;height:100%;object-fit:cover}
.game-info{padding:.85rem;text-align:center}
.game-name{font-size:.9rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.back-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:.5rem;transition:background .2s}
.back-btn:hover{background:rgba(255,255,255,.1)}
.game-iframe-wrapper{width:100%;flex-grow:1;background:#000;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);position:relative;min-height:450px}
.game-iframe{width:100%;height:100%;border:none}
.game-iframe-wrapper:fullscreen,.game-iframe-wrapper:-webkit-full-screen{width:100vw;height:100vh;border:none;border-radius:0;background:#000}
.game-iframe-wrapper:fullscreen .game-iframe,.game-iframe-wrapper:-webkit-full-screen .game-iframe{width:100%;height:100%}
.game-iframe-wrapper.pseudo-fs{position:fixed;inset:0;z-index:9999;border-radius:0;border:none;min-height:0}
.loader-overlay{position:absolute;inset:0;background:#08080c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9494a0;font-size:.9rem;gap:.75rem;z-index:5}
.hero-banner{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center}
.hero-info h3{font-size:1.1rem;font-weight:600;margin-bottom:.25rem;color:#fff}
.hero-info p{font-size:.85rem;color:#9494a0}
.play-btn{background:#fff;color:#050508;border:none;padding:.6rem 1.25rem;font-weight:600;font-size:.85rem;border-radius:8px;cursor:pointer;transition:opacity .2s,transform .2s}
.play-btn:hover{opacity:.9;transform:translateY(-1px)}
.quick-grid{display:grid;grid-template-columns:1fr;gap:1rem;overflow-y:auto;flex-grow:1;padding-right:4px}
.quick-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);padding:1.25rem;border-radius:10px;transition:border-color .2s}
.quick-card h4{font-size:.95rem;font-weight:600;color:#fff;margin-bottom:.3rem}
.chat-messages{flex-grow:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:1rem;overflow-y:auto;margin-bottom:1rem;display:flex;flex-direction:column;gap:.75rem}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-card{background:#0c0c12;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:2.5rem;width:100%;max-width:460px;box-shadow:0 25px 50px rgba(0,0,0,.8);transform:scale(.95);transition:transform .25s cubic-bezier(.16,1,.3,1);max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal-card{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.75rem}
.modal-title{font-size:1.25rem;font-weight:600;letter-spacing:.02em}
.modal-close{background:none;border:none;color:#9494a0;cursor:pointer;font-size:1.25rem;padding:.25rem;transition:color .2s}
.modal-close:hover{color:#fff}
.setting-group{margin-bottom:1.5rem}
.setting-label{display:flex;justify-content:space-between;font-size:.85rem;font-weight:500;color:#b0b0bc;margin-bottom:.5rem}
.setting-label span{color:#fff;font-family:monospace}
.setting-slider{width:100%;accent-color:#fff;cursor:pointer;height:6px;background:rgba(255,255,255,.1);border-radius:3px;appearance:none}
.setting-slider::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer}
.toast-stack{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:10px;pointer-events:none;align-items:center;width:calc(100% - 2rem);max-width:420px}
.toast{background:rgba(12,12,18,.95);border:1px solid rgba(100,181,246,.4);border-left:4px solid #64b5f6;padding:.85rem 1.25rem;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.5);backdrop-filter:blur(12px);color:#fff;font-size:.85rem;line-height:1.5;width:100%;animation:toastIn .3s cubic-bezier(.16,1,.3,1) forwards;pointer-events:auto}
.toast .t-title{font-weight:600;text-transform:uppercase;font-size:.72rem;letter-spacing:.06em;margin-bottom:.15rem;color:#64b5f6}
.toast.error{border-color:rgba(255,85,85,.45);border-left-color:#ff5555}.toast.error .t-title{color:#ff5555}
.toast.success{border-color:rgba(80,250,123,.4);border-left-color:#50fa7b}.toast.success .t-title{color:#50fa7b}
.toast.out{opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<script>
// ================= IN-SITE NOTIFICATIONS =================
function showNotice(message, type, title) {
    const stack = document.getElementById('toastStack');
    if (!stack) return;
    type = type || 'info';
    const labels = { info: 'Notice', error: 'Error', success: 'Success' };
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = '<div class="t-title">' + escapeHtml(title || labels[type] || 'Notice') + '</div><div>' + escapeHtml(message) + '</div>';
    stack.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, type === 'error' ? 6000 : 3500);
}

// ================= FIREBASE =================
const firebaseConfig = {
    databaseURL: "https://skyline-7330c-default-rtdb.firebaseio.com",
    projectId: "skyline-7330c"
};
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();

// ================= SAVING (cookie + localStorage) =================
function setCookie(name, value, days) {
    let expires = "";
    if (days) {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + encodeURIComponent(value || "") + expires + "; path=/; SameSite=Lax";
}
function getCookie(name) {
    const nameEQ = name + "=";
    for (let c of document.cookie.split(';')) {
        c = c.trim();
        if (c.indexOf(nameEQ) === 0) {
            try { return decodeURIComponent(c.substring(nameEQ.length)); } catch (e) { return c.substring(nameEQ.length); }
        }
    }
    return null;
}
function saveSetting(key, value) {
    setCookie(key, String(value), 365);
    try { localStorage.setItem(key, String(value)); } catch (e) {}
}
function loadSetting(key, fallback) {
    let v = null;
    try { v = localStorage.getItem(key); } catch (e) {}
    if (v === null || v === undefined) v = getCookie(key);
    return (v === null || v === undefined || v === '') ? fallback : v;
}
function removeSetting(key) {
    setCookie(key, '', -1);
    try { localStorage.removeItem(key); } catch (e) {}
}

let currentUser = loadSetting('skyline_username', '');
let ownerKeyInputVal = loadSetting('skyline_owner_key', '');

// ================= LIVE PLAYERS + UNIQUE VISITORS =================
const visitorId = (() => {
    let id = loadSetting('skyline_vid', '');
    if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); saveSetting('skyline_vid', id); }
    return id;
})();
const presenceRef = rtdb.ref('presence/' + visitorId);

function updatePresence() {
    const playing = new URLSearchParams(window.location.search).get('page') === 'play';
    presenceRef.set({ playing: playing, ts: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
}
function initPresence() {
    presenceRef.onDisconnect().remove().catch(() => {});
    rtdb.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) { presenceRef.onDisconnect().remove().catch(() => {}); updatePresence(); }
    });
    if (loadSetting('skyline_counted', '') !== '1') {
        rtdb.ref('stats/visitors').transaction(v => (v || 0) + 1, (err, committed) => {
            if (!err && committed) saveSetting('skyline_counted', '1');
        });
    }
}
function initHomeStats() {
    trackListener(rtdb.ref('presence'), (snap) => {
        let online = 0, playing = 0;
        snap.forEach(c => { online++; if (c.val() && c.val().playing) playing++; });
        const o = document.getElementById('statOnline'), p = document.getElementById('statPlaying');
        if (o) o.textContent = online;
        if (p) p.textContent = playing;
    });
    trackListener(rtdb.ref('stats/visitors'), (snap) => {
        const v = document.getElementById('statVisitors');
        if (v) v.textContent = (snap.val() || 0).toLocaleString();
    });
}

// Roles: 2x `𒐫` (or "u1242b unicode") = owner, 1x `𒐫` (or "u1242a") = admin
function getUserRole() {
    const val = ownerKeyInputVal.trim();
    if (val === '𒐫𒐫' || val.toLowerCase() === 'u1242b unicode') return 'owner';
    if (val === '𒐫' || val.toLowerCase() === 'u1242a') return 'admin';
    return 'none';
}
const isOwner = () => getUserRole() === 'owner';
const isAdmin = () => getUserRole() === 'admin' || isOwner();

function roleBadgeHtml(role) {
    if (role === 'owner') return '<span class="owner-badge">Owner</span>';
    if (role === 'admin') return '<span class="admin-badge">Admin</span>';
    return '';
}

// ================= PROFANITY FILTER (words come from profanity.json) =================
const WORDS_URL = 'https://raw.githubusercontent.com/NankaOfficial/SkyLine/refs/heads/main/words.json';
const FALLBACK_WORDS = { severe: ['fuck', 'fuk', 'fck', 'nigg', 'cunt', 'bitch'], whole: ['shit', 'ass'], emoji: ['🖕'] };
const LEET_MAP = { '@': 'a', '$': 's', '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '+': 't' };
const VOWELS = 'aeiou';
let SEVERE_REGEXES = [], WHOLE_REGEXES = [], BAD_EMOJI = [];

// A vowel may be the real letter OR any symbol (f*ck, f#ck, sh!t, a$$); letters may be stretched/separated (f u c k, f.u.c.k)
function wildPattern(word) {
    return word.toLowerCase().replace(/[^a-z]/g, '').split('').map(c =>
        VOWELS.includes(c) ? '(?:' + c + '+|[^a-z\\s])' : c + '+'
    ).join('[^a-z]*');
}
function buildFilters(d) {
    SEVERE_REGEXES = (d.severe || []).map(w => new RegExp(wildPattern(w)));
    WHOLE_REGEXES = (d.whole || []).map(w => new RegExp('^' + wildPattern(w) + '(?:s|es|ed|er|ers|ing|y|ie)?$'));
    BAD_EMOJI = d.emoji || [];
}
async function loadWordLists() {
    try {
        const r = await fetch(WORDS_URL + '?t=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        buildFilters(await r.json());
    } catch (e) { /* keep fallback list */ }
}
function leetNormalize(str) {
    return str
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/(?<=[a-z])!(?=[a-z])/g, 'i')
        .replace(/[@$013457+]/g, ch => LEET_MAP[ch] || ch);
}
function containsBadWord(str) {
    if (!str) return false;
    const clean = String(str).replace(/[\u200B-\u200D\u2060\uFEFF]/g, '');
    if (BAD_EMOJI.some(e => clean.includes(e))) return true;
    const norm = leetNormalize(clean);
    if (SEVERE_REGEXES.some(r => r.test(norm))) return true;
    return norm.split(/[\s,;:\/|]+/)
        .map(t => t.replace(/^[.,;:"'()\[\]]+|[.,;:"'()\[\]]+$/g, ''))
        .filter(Boolean)
        .some(t => WHOLE_REGEXES.some(r => r.test(t)));
}

async function kickFromChat(badText) {
    let mins = LADDER_MIN[0];

        await rtdb.ref('offenders/' + visitorId).transaction(cur => {
            cur = cur || { firstAt: Date.now() };
            cur.count = (cur.count || 0) + 1;

        });

        saveSetting('skyline_chat_ban', Date.now() + mins * 60000);

function trackListener(query, cb) {

// Sort: symbols first, then numbers, then letters
function sortRank(title) {
    const c = title.trim().charAt(0);
    if (/\p{L}/u.test(c)) return 2;
    if (/\d/.test(c)) return 1;
    return 0;
}
function sortGames(list) {
    return list.sort((a, b) => {
        const ra = sortRank(a.title), rb = sortRank(b.title);
        if (ra !== rb) return ra - rb;
        return a.title.trim().localeCompare(b.title.trim(), undefined, { numeric: true, sensitivity: 'base' });
    });
}
function getGames() {
    if (!gamesPromise) {
        gamesPromise = fetch(GAMES_JSON_URL + '?t=' + Date.now())
            .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
            .then(data => sortGames((data.games || []).filter(g => g && g.title && g.source)))
            .catch(err => { gamesPromise = null; throw err; });
    }
    return gamesPromise;
}

function normalizeGithubUrl(u) {
    const m = u.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/raw\/(.+)$/i);
    return m ? `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}` : u;
}

// jsDelivr serves repo files with correct MIME types so relative scripts/css/wasm load
function getBaseHref(source) {
    const dir = source.slice(0, source.lastIndexOf('/') + 1);
    const m = dir.match(/^https:\/\/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/(?:refs\/heads\/)?([^\/]+)\/(.*)$/);
    return m ? `https://cdn.jsdelivr.net/gh/${m[1]}/${m[2]}@${m[3]}/${m[4]}` : dir;
}

function buildGameDocument(rawText, baseHref) {
    const text = rawText.replace(/^\uFEFF/, '');
    const head = text.slice(0, 3000);
    const CLOSE = '</' + 'script>';
    const errScript = "window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;color:#ff5555;font:12px monospace;background:#111;padding:10px;border-radius:8px;z-index:99999';d.textContent='Runtime Error: '+e.message;document.body.appendChild(d);});";
    const wasmShim = '<script>(function(){if(!window.WebAssembly)return;var i=WebAssembly.instantiateStreaming,c=WebAssembly.compileStreaming;if(i)WebAssembly.instantiateStreaming=function(r,m){return Promise.resolve(r).then(function(x){return x.arrayBuffer()}).then(function(b){return WebAssembly.instantiate(b,m)})};if(c)WebAssembly.compileStreaming=function(r){return Promise.resolve(r).then(function(x){return x.arrayBuffer()}).then(function(b){return WebAssembly.compile(b)})};})();' + CLOSE;
    let doc;

    if (/<!doctype\s+html|<html[\s>]/i.test(head)) {
        doc = text;
    } else if (/^\s*</.test(text)) {
        doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;background:#000}</style></head><body>' + text + '</body></html>';
    } else {
        doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center}canvas{display:block;max-width:100%;max-height:100%}</style></head><body><script>' + errScript + CLOSE + '<script>' + text.replace(/<\/script/gi, '<\\/script') + '\n' + CLOSE + '</body></html>';
    }

    const tag = (baseHref && !/<base\s/i.test(doc) ? '<base href="' + baseHref.replace(/"/g, '%22') + '">' : '') + wasmShim;
    if (/<head[^>]*>/i.test(doc)) doc = doc.replace(/<head[^>]*>/i, (m) => m + tag);
    else if (/<html[^>]*>/i.test(doc)) doc = doc.replace(/<html[^>]*>/i, (m) => m + '<head>' + tag + '</head>');
    else doc = doc.replace(/<!doctype[^>]*>/i, (m) => m + tag);
    return doc;
}

async function loadAndEmulateGame(source) {
    const iframe = document.getElementById('gameIframe');
    const loader = document.getElementById('loaderOverlay');
    try {
        source = normalizeGithubUrl(source);
        const games = await getGames();
        if (!games.some(g => normalizeGithubUrl(g.source) === source)) throw new Error('Game not found in the games list.');
        const res = await fetch(source);
        if (!res.ok) throw new Error('Failed to load game file (HTTP ' + res.status + ')');
        const html = await res.text();
        iframe.addEventListener('load', () => { if (loader) loader.style.display = 'none'; }, { once: true });
        iframe.srcdoc = buildGameDocument(html, getBaseHref(source));
    } catch (err) {
        if (loader) loader.innerHTML = `<p style="color:#ff5555;text-align:center;padding:20px;">Error Loading Game<br><small style="color:#9494a0;">${escapeHtml(err.message)}</small></p>`;
    }
}

        wrap.classList.remove('pseudo-fs');

        if (req) req.call(wrap);
        else { wrap.classList.add('pseudo-fs'); nudgeGameResize(); }
    }
}

        const val = snapshot.val();
        if (!val) {
            container.innerHTML = '<div style="color:#727280;text-align:center;font-size:.85rem;margin:auto;">No messages yet. Say hello!</div>';
            return;
        }
        Object.keys(val).forEach(msgKey => {
            const msg = val[msgKey];
            const msgDiv = document.createElement('div');
            msgDiv.style.cssText = 'background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:.6rem .8rem;border-radius:8px;font-size:.9rem;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;';

            const fromOwner = msg.role === 'owner';
            const safeText = (!fromOwner && containsBadWord(msg.text)) ? '<em style="color:#727280;">[message removed]</em>' : escapeHtml(msg.text || '');
            const safeUser = (!fromOwner && containsBadWord(msg.user)) ? 'User' : escapeHtml(msg.user || 'Anonymous');
            const nameClass = msg.role === 'owner' ? 'name-owner' : (msg.role === 'admin' ? 'name-admin' : '');
            const badgeHtml = roleBadgeHtml(msg.role);
            const timeStr = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const deleteBtnHtml = isAdmin() ? `<button onclick="deleteChatMessage('${msgKey}')" style="background:none;border:none;color:#ff5555;cursor:pointer;font-size:.8rem;margin-left:8px;" title="Delete Message">Delete</button>` : '';

            msgDiv.innerHTML = `<div><strong class="${nameClass}" style="color:#64b5f6;font-size:.8rem;display:block;margin-bottom:.2rem;">${safeUser}${badgeHtml}</strong>${safeText}</div><div style="display:flex;align-items:center;gap:6px;"><span style="font-size:.7rem;color:#555;white-space:nowrap;">${timeStr}</span>${deleteBtnHtml}</div>`;
            container.appendChild(msgDiv);
        });
        container.scrollTop = container.scrollHeight;
    });
}

function deleteChatMessage(msgKey) {
    if (!isAdmin()) return;
    rtdb.ref('chat/' + msgKey).remove();
}

function sendChatMessage() {
    const input = document.getElementById('chatInput');
    if (!input || !input.value.trim()) return;
    if (isChatBanned()) { renderPage(); return; }

    const text = input.value.trim();
    if (!isOwner() && containsBadWord(text)) {
        input.value = '';
        kickFromChat(text);
        return;
    }

    rtdb.ref('chat').push({
        user: hasValidName() ? currentUser : 'Player',
        text: text,
        role: getUserRole(),
        vid: visitorId,
        timestamp: Date.now()
    });
    input.value = '';
}

function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ================= STARFIELD =================
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let shootingStars = [];
let lastShootingStarTime = 0;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
}
function initStars() {
    stars = [];
    const palette = ['#ffffff', '#8be9fd', '#ff79c6', '#50fa7b', '#f1fa8c', '#ffb86c'];
    for (let i = 0; i < config.starCount; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5 + 0.5,
            alpha: Math.random(),
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            color: config.colorful ? palette[Math.floor(Math.random() * palette.length)] : '#FFFFFF'
        });
    }
}
function spawnShootingStar() {
    const angle = Math.PI / 4;
    const speed = Math.random() * 10 + 12;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed;
    const hypot = Math.hypot(dx, dy);
    shootingStars.push({
        x: Math.random() * canvas.width * 1.2 - canvas.width * 0.1,
        y: Math.random() * (canvas.height * 0.5),
        dx, dy, ux: dx / hypot, uy: dy / hypot,
        length: Math.random() * 120 + 80,
        life: 1.0,
        decay: Math.random() * 0.015 + 0.015
    });
}
function animate(timestamp) {
    if (starfieldPaused) { requestAnimationFrame(animate); return; }
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (const s of stars) {
        s.alpha += s.twinkleSpeed;
        if (s.alpha > 1 || s.alpha < 0.2) s.twinkleSpeed = -s.twinkleSpeed;
        ctx.fillStyle = s.color;
        ctx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    if (timestamp - lastShootingStarTime > config.rarityMs) {
        spawnShootingStar();
        lastShootingStarTime = timestamp;
    }

    for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        const tailX = ss.x - ss.ux * ss.length;
        const tailY = ss.y - ss.uy * ss.length;
        const gradient = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
        gradient.addColorStop(0, '#FFFFFF');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');

        ctx.beginPath();
        ctx.moveTo(ss.x, ss.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.8;
        ctx.globalAlpha = ss.life;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ss.x, ss.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ss.x += ss.dx;
        ss.y += ss.dy;
        ss.life -= ss.decay;
        if (ss.life <= 0 || ss.x > canvas.width + 200 || ss.y > canvas.height + 200) shootingStars.splice(i, 1);
    }

    ctx.globalAlpha = 1.0;
    requestAnimationFrame(animate);
}
