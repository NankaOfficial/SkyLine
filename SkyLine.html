<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyLine</title>
    
    <!-- Firebase App & Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background-color: #050508;
            color: #f1f1f3;
            height: 100vh;
            width: 100vw;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        #starfield, #matrixCanvas {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        #starfield {
            background-color: #050508;
        }

        #matrixCanvas {
            display: none;
            z-index: 2;
        }

        /* Persistent Top Bar */
        .navbar {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(5, 5, 8, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @media (min-width: 768px) {
            .navbar {
                padding: 1.5rem 3rem;
            }
        }

        .nav-left {
            justify-self: start;
            display: flex;
            align-items: center;
        }

        .nav-links {
            justify-self: center;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .nav-right {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #9494a0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem;
            border-radius: 8px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .icon-btn.active {
            color: #64b5f6;
            background: rgba(255, 255, 255, 0.05);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .glow-title {
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #9494a0;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: color 0.2s ease, background 0.2s ease;
            cursor: pointer;
        }

        .nav-item svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Glitch-free Announcement Bar (Auto-hides after 5s) */
        .announcement-bar {
            position: relative;
            z-index: 10;
            height: 36px;
            background: rgba(12, 12, 18, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #b0b0bc;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .announcement-bar.visible {
            visibility: visible;
            opacity: 1;
        }

        /* Event Stack Container (Bottom Right Corner) */
        .event-stack {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            max-height: 70vh;
            overflow-y: auto;
        }

        .event-card {
            background: rgba(12, 12, 18, 0.95);
            border: 1px solid rgba(100, 181, 246, 0.4);
            border-left: 4px solid #64b5f6;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            color: #fff;
            font-size: 0.85rem;
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: auto;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            position: relative;
        }

        .event-card .title {
            font-weight: 600;
            color: #64b5f6;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Badges Styling */
        .owner-badge {
            background: linear-gradient(135deg, #ff79c6, #bd93f9);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-left: 6px;
            vertical-align: middle;
            box-shadow: 0 0 10px rgba(189, 147, 249, 0.4);
        }

        .admin-badge {
            background: linear-gradient(135deg, #50fa7b, #8be9fd);
            color: #050508;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-left: 6px;
            vertical-align: middle;
            box-shadow: 0 0 10px rgba(80, 250, 123, 0.4);
        }

        /* Content Viewport */
        .content-viewport {
            position: relative;
            z-index: 10;
            width: 100%;
            height: calc(100vh - 110px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            pointer-events: none;
            overflow-y: auto;
        }

        .page-container {
            pointer-events: auto;
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 950px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            overflow: hidden;
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .animate-slide-up {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
            color: #ffffff;
        }

        .page-desc {
            color: #9494a0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* Form Inputs */
        .search-container {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .search-input:focus {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: #727280;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.25rem;
            overflow-y: auto;
            padding-right: 0.25rem;
            flex-grow: 1;
        }

        .games-grid::-webkit-scrollbar {
            width: 6px;
        }

        .games-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
        }

        .game-img-container {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            padding: 0.85rem;
            text-align: center;
        }

        .game-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Game Player Container */
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .game-iframe-wrapper {
            width: 100%;
            flex-grow: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            min-height: 450px;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loader-overlay {
            position: absolute;
            inset: 0;
            background: #08080c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9494a0;
            font-size: 0.9rem;
            gap: 0.75rem;
            z-index: 5;
        }

        /* Dashboard Home Components */
        .hero-banner {
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #fff;
        }

        .hero-info p {
            font-size: 0.85rem;
            color: #9494a0;
        }

        .play-btn {
            background: #fff;
            color: #050508;
            border: none;
            padding: 0.6rem 1.25rem;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .play-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .quick-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
        }

        .quick-grid::-webkit-scrollbar {
            width: 6px;
        }

        .quick-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .quick-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.25rem;
            border-radius: 10px;
            transition: border-color 0.2s;
        }

        .quick-card h4 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        /* Chat Messages Container */
        .chat-messages {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 1rem;
            overflow-y: auto;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* Settings Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #0c0c12;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.open .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .modal-close {
            background: none;
            border: none;
            color: #9494a0;
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.25rem;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .setting-group {
            margin-bottom: 1.5rem;
        }

        .setting-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            color: #b0b0bc;
            margin-bottom: 0.5rem;
        }

        .setting-label span {
            color: #fff;
            font-family: monospace;
        }

        .setting-slider {
            width: 100%;
            accent-color: #ffffff;
            cursor: pointer;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            appearance: none;
        }

        .setting-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>
    <canvas id="matrixCanvas"></canvas>

    <!-- Persistent Top Bar -->
    <header class="navbar">
        <div class="nav-left">
            <h1 class="glow-title">SkyLine</h1>
        </div>

        <nav class="nav-links">
            <a href="?page=games" class="nav-item" data-page="games">
                <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4m-2-2v4m10-2h.01M15 11h.01"></path></svg>
                Games
            </a>
            <a href="?page=home" class="nav-item" data-page="home">Home</a>
            <a href="?page=chat" class="nav-item" data-page="chat">Chat</a>
        </nav>

        <div class="nav-right">
            <!-- Secret Developer Tab Button -->
            <button class="icon-btn" id="devNavBtn" title="Admin Menu" style="display: none;" onclick="navigateToDev()">
                <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            </button>
            <button class="icon-btn" id="settingsToggle" title="Settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Glitch-free Announcement Text Bar -->
    <div class="announcement-bar" id="announcementBar">
        <span id="announcementText"></span>
    </div>

    <!-- Bottom Right Event Stack Container -->
    <div class="event-stack" id="eventStack"></div>

    <!-- Content Area -->
    <main class="content-viewport" id="viewport">
        <!-- Rendered dynamically -->
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Settings & Profile</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            
            <div class="setting-group">
                <div class="setting-label">Display Nickname <span>(max 15)</span></div>
                <input type="text" class="search-input" id="settingsNameInput" maxlength="15" style="margin-bottom: 0;" oninput="updateUsername(this.value)" placeholder="Enter custom display name...">
            </div>

            <div class="setting-group">
                <div class="setting-label">Code</div>
                <input type="password" class="search-input" id="ownerKeyInput" style="margin-bottom: 0.5rem;" placeholder="Enter code...">
                <button class="play-btn" style="width: 100%; text-align: center; background: #64b5f6; color: #050508;" onclick="submitCodeButton()">Enter Code</button>
            </div>

            <div class="setting-group">
                <div class="setting-label">Star Amount <span id="starCountVal">800</span></div>
                <input type="range" class="setting-slider" id="starCountRange" min="100" max="2500" step="50" value="800">
            </div>

            <div class="setting-group">
                <div class="setting-label">Meteor Fall Chance (Frequency) <span id="rarityVal">800ms</span></div>
                <input type="range" class="setting-slider" id="rarityRange" min="200" max="3000" step="100" value="800">
            </div>

            <div class="setting-group" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="setting-label" style="margin-bottom: 0;">Colorful Stars</div>
                <input type="checkbox" id="colorfulToggle" style="accent-color: #fff; cursor: pointer; width: 18px; height: 18px;" onchange="updateColorfulStars(this.checked)">
            </div>
        </div>
    </div>

    <script>
        // Initialize Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://skyline-7330c-default-rtdb.firebaseio.com",
            projectId: "skyline-7330c"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        // Cookie Helper Functions
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // User Identity state from cookies
        let currentUser = getCookie('skyline_username') || 'Player';
        let ownerKeyInputVal = getCookie('skyline_owner_key') || '';

        // Role Resolution: 2 `𒐫` (or u1242b unicode) = owner, 1 `𒐫` (or u1242a) = admin
        function getUserRole() {
            const val = ownerKeyInputVal.trim();
            if (val === '𒐫𒐫' || val.toLowerCase() === 'u1242b unicode') return 'owner';
            if (val === '𒐫' || val.toLowerCase() === 'u1242a') return 'admin';
            return 'none';
        }

        const isOwner = () => getUserRole() === 'owner';

        function launchGame(sourceUrl, title) {
            const decodedTitle = decodeURIComponent(title);
            const safeKey = decodedTitle.replace(/[.#$\/\[\]]/g, '_');
            
            rtdb.ref('games/' + safeKey).transaction(current => {
                if (!current) {
                    return { title: decodedTitle, plays: 1 };
                }
                current.plays = (current.plays || 0) + 1;
                return current;
            });

            window.history.pushState({}, '', `?page=play&src=${sourceUrl}&title=${title}`);
            renderPage();
        }

        async function loadAndEmulateGame(sourceUrlDecoded) {
            const iframe = document.getElementById('gameIframe');
            const loader = document.getElementById('loaderOverlay');
            const sourceUrl = decodeURIComponent(sourceUrlDecoded);
            
            try {
                const res = await fetch(sourceUrl + (sourceUrl.includes('?') ? '&' : '?') + 't=' + Date.now());
                if (!res.ok) throw new Error('Failed to load game file (HTTP ' + res.status + ')');
                const text = await res.text();
                
                let finalHtml = text;
                const trimmed = text.trim().toLowerCase();
                
                // Check if it's a raw script (doesn't start with <html> or <!doctype)
                if (!trimmed.startsWith('<!doctype') && !trimmed.startsWith('<html')) {
                    finalHtml = `<!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            * { box-sizing: border-box; margin: 0; padding: 0; }
                            body, html { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
                            canvas { display: block; max-width: 100%; max-height: 100%; }
                        </style>
                    </head>
                    <body>
                        <script>
                            try {
                                ${text}
                            } catch(e) {
                                console.error(e);
                                document.body.innerHTML = '';
                                const errDiv = document.createElement('div');
                                errDiv.style.cssText = 'color:#ff5555;font-family:monospace;padding:20px;background:#111;border-radius:8px;max-width:90%;';
                                const h3 = document.createElement('h3');
                                h3.textContent = 'Runtime Error';
                                const p = document.createElement('p');
                                p.textContent = e.message;
                                errDiv.appendChild(h3);
                                errDiv.appendChild(p);
                                document.body.appendChild(errDiv);
                            }
                        </` + `script>
                    </body>
                    </html>`;
                }

                const blob = new Blob([finalHtml], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                
                if (iframe) iframe.src = blobUrl;
                if (loader) loader.style.display = 'none';
            } catch (err) {
                if (loader) {
                    loader.innerHTML = `<p style="color: #ff5555; text-align: center; padding: 20px;">Error Loading Game<br><small style="color:#9494a0;">${escapeHtml(err.message)}</small></p>`;
                }
            }
        }

                        <p class="page-desc">${current.desc}</p>
                        <div class="quick-grid">
                            <div class="quick-card">
                               <h4>Countdown Timer (Admin Abuse / Event)</h4>
                               <p style="color: #9494a0; font-size: 0.85rem; margin-bottom: 0.75rem;">Set a live synchronized countdown timer visible in the corner for all connected users.</p>
                               <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                                   <input type="text" class="search-input" id="countdownTitleInput" placeholder="Event Name (e.g. Admin Abuse)" style="flex: 2; margin-bottom: 0;">
                                   <input type="number" class="search-input" id="countdownMinsInput" placeholder="Minutes" style="flex: 1; margin-bottom: 0;" min="0.1" step="0.5">
                                   <button class="play-btn" onclick="startGlobalCountdown()" style="white-space: nowrap; background: #ff79c6; color: #050508;">Start Countdown</button>
                                   <button class="play-btn" onclick="clearGlobalCountdown()" style="white-space: nowrap; background: #ff5555; color: #fff;">Clear</button>
                               </div>
                            </div>
                            <div class="quick-card">
                               <h4>Broadcast Announcement</h4>
                               <p style="color: #9494a0; font-size: 0.85rem; margin-bottom: 0.75rem;">Type an announcement to display text across the top bar menu for all users (auto-dismisses in 5s).</p>
                               <div style="display: flex; gap: 0.75rem;">
                                   <input type="text" class="search-input" id="announcementInput" placeholder="Enter announcement text..." style="margin-bottom: 0;" onkeydown="if(event.key==='Enter') broadcastAnnouncement()">
                                   <button class="play-btn" onclick="broadcastAnnouncement()" style="white-space: nowrap;">Publish</button>
                                   <button class="play-btn" onclick="clearAnnouncement()" style="white-space: nowrap; background: #ff5555; color: #fff;">Clear</button>
                               </div>
                            </div>
                            <div class="quick-card">
                               <h4>20 Special Event Triggers</h4>
                               <p style="color: #9494a0; font-size: 0.85rem; margin-bottom: 0.75rem;">Launch or stop any of the 20 special event routines into the live event stack.</p>
                               <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem; max-height: 280px; overflow-y: auto; padding-right: 4px;">
                                   ${eventsHtml}
                               </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (current.isChat) {
                viewport.innerHTML = `
                    <div class="page-container ${current.animation}" style="height: 75vh;">
                        <h2 class="page-title">${current.title}</h2>
                        <p class="page-desc">${current.desc}</p>
                        <div class="chat-messages" id="chatMessages">
                            <div style="color: #727280; text-align: center; font-size: 0.85rem; margin: auto;">Connecting to chat network...</div>
                        </div>
                        <div style="display: flex; gap: 0.75rem;">
                            <input type="text" class="search-input" id="chatInput" placeholder="Type a message..." style="margin-bottom: 0;" onkeydown="if(event.key==='Enter') sendChatMessage()">
                            <button class="play-btn" onclick="sendChatMessage()" style="white-space: nowrap;">Send</button>
                        </div>
                    </div>
                `;
                initChatListener();
            }
        }

        function handleSearch(query) {
            const filtered = allGames.filter(g => {
                const title = (g.title || '').toLowerCase();
                return title.includes(query.toLowerCase());
            });
            renderGamesList(filtered);
        }

        document.querySelectorAll('.nav-item').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetUrl = link.getAttribute('href');
                window.history.pushState({}, '', targetUrl);
                renderPage();
            });
        });

        window.addEventListener('popstate', renderPage);
        renderPage();

        // Starfield Engine with Color and Meteor Controls
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let shootingStars = [];
        let lastShootingStarTime = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const colorPalette = ['#ffffff', '#8be9fd', '#ff79c6', '#50fa7b', '#f1fa8c', '#ffb86c'];
            for (let i = 0; i < config.starCount; i++) {
                let starColor = '#FFFFFF';
                if (config.colorful) {
                    starColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                }
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    color: starColor
                });
            }
        }

        function spawnShootingStar() {
            const startX = Math.random() * canvas.width * 1.2 - canvas.width * 0.1;
            const startY = Math.random() * (canvas.height * 0.5);
            const length = Math.random() * 120 + 80;
            const speed = Math.random() * 10 + 12;
            const angle = Math.PI / 4;
            const dx = Math.cos(angle) * speed;
            const dy = Math.sin(angle) * speed;
            const hypot = Math.hypot(dx, dy);

            shootingStars.push({
                x: startX,
                y: startY,
                dx: dx,
                dy: dy,
                ux: dx / hypot,
                uy: dy / hypot,
                length: length,
                life: 1.0,
                decay: Math.random() * 0.015 + 0.015
            });
        }

        function animate(timestamp) {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < stars.length; i++) {
                let s = stars[i];
                s.alpha += s.twinkleSpeed;
                if (s.alpha > 1 || s.alpha < 0.2) {
                    s.twinkleSpeed = -s.twinkleSpeed;
                }

                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }

            if (timestamp - lastShootingStarTime > config.rarityMs) {
                spawnShootingStar();
                lastShootingStarTime = timestamp;
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let ss = shootingStars[i];
                let tailX = ss.x - ss.ux * ss.length;
                let tailY = ss.y - ss.uy * ss.length;

                let gradient = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
                gradient.addColorStop(0, '#FFFFFF');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.8;
                ctx.globalAlpha = ss.life;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();

                ss.x += ss.dx;
                ss.y += ss.dy;
                ss.life -= ss.decay;

                if (ss.life <= 0 || ss.x > canvas.width + 200 || ss.y > canvas.height + 200) {
                    shootingStars.splice(i, 1);
                }
            }

            if (activeCountdownData && activeCountdownData.endTime) {
                renderEventStack();
            }

            ctx.globalAlpha = 1.0;
            requestAnimationFrame(animate);
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 100);
        });

        resizeCanvas();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
