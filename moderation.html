<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyLine Moderation</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#050508;color:#f1f1f3;padding:1.5rem;min-height:100vh}
h1{font-size:1.4rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem}
.box{max-width:960px;margin:0 auto}
input[type=text],input[type=password]{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.6rem .9rem;color:#fff;outline:none}
button{border:none;border-radius:8px;padding:.45rem .9rem;font-weight:600;font-size:.8rem;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
button.red{background:#ff5555}button.green{background:#50fa7b;color:#050508}button.blue{background:#64b5f6;color:#050508}
.bar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.bar input[type=text]{flex:1;min-width:180px}
.stats{display:flex;gap:.75rem;margin-bottom:1rem}
.stat{flex:1;background:#0c0c12;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:.8rem;text-align:center}
.stat b{display:block;font-size:1.5rem;font-family:monospace}
.card{background:#0c0c12;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:1rem;margin-bottom:.75rem}
.card.blocked{border-color:rgba(255,85,85,.5)}
.row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.name{font-weight:700}.muted{color:#9494a0;font-size:.8rem}
.tag{font-size:.65rem;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:6px;background:#ff5555}
.tag.t{background:#ffb86c;color:#050508}
.msg{background:rgba(255,255,255,.04);border-radius:8px;padding:.5rem .7rem;margin:.6rem 0;font-family:monospace;font-size:.8rem;word-break:break-word}
details{margin-top:.5rem}summary{cursor:pointer;color:#64b5f6;font-size:.8rem}
.dev{font-family:monospace;font-size:.75rem;color:#9494a0;margin-top:.4rem;line-height:1.6;word-break:break-all}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
[hidden]{display:none!important}
</style></head><body><div class="box">
<h1>SkyLine Moderation</h1>

<div id="gate">
  <p class="muted" style="margin-bottom:.75rem">Enter your admin/owner code.</p>
  <div class="bar"><input type="password" id="code" placeholder="Code..."><button class="blue" onclick="unlock(document.getElementById('code').value)">Enter</button></div>
  <p id="gateErr" class="muted" style="color:#ff5555"></p>
</div>

<div id="app" hidden>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span class="muted">Offenders</span></div>
    <div class="stat"><b id="sTimed" style="color:#ffb86c">0</b><span class="muted">Timed out now</span></div>
    <div class="stat"><b id="sBlocked" style="color:#ff5555">0</b><span class="muted">Blocked</span></div>
  </div>
  <div class="bar">
    <input type="text" id="q" placeholder="Search name, device ID, message..." oninput="draw()">
    <label class="muted"><input type="checkbox" id="onlyBlocked" onchange="draw()"> Blocked only</label>
  </div>
  <div id="list"></div>
</div>

<script>
firebase.initializeApp({ databaseURL: "https://skyline-7330c-default-rtdb.firebaseio.com", projectId: "skyline-7330c" });
const db = firebase.database();
let data = {};

function roleOf(v) {
  v = (v || '').trim();
  if (v === '𒐫𒐫' || v.toLowerCase() === 'u1242b unicode') return 'owner';
  if (v === '𒐫' || v.toLowerCase() === 'u1242a') return 'admin';
  return 'none';
}
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function unlock(code) {
  if (roleOf(code) === 'none') { document.getElementById('gateErr').textContent = 'Invalid code.'; return; }
  try { localStorage.setItem('skyline_owner_key', code.trim()); } catch (e) {}
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  db.ref('offenders').on('value', s => { data = s.val() || {}; draw(); });
}
try { const saved = localStorage.getItem('skyline_owner_key'); if (saved && roleOf(saved) !== 'none') unlock(saved); } catch (e) {}

function fmtLeft(ms) {
  const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return (h ? h + 'h ' : '') + m + 'm ' + (s % 60) + 's';
}

function draw() {
  const q = document.getElementById('q').value.toLowerCase();
  const only = document.getElementById('onlyBlocked').checked;
  const now = Date.now();
  const all = Object.entries(data).map(([id, o]) => ({ id, ...o }));
  document.getElementById('sTotal').textContent = all.length;
  document.getElementById('sTimed').textContent = all.filter(o => !o.blocked && (o.bannedUntil || 0) > now).length;
  document.getElementById('sBlocked').textContent = all.filter(o => o.blocked).length;

  const rows = all
    .filter(o => (!only || o.blocked) && (!q || [o.id, o.name, o.lastMessage].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0));

  document.getElementById('list').innerHTML = rows.length ? rows.map(o => {
    const d = o.device || {};
    return `<div class="card ${o.blocked ? 'blocked' : ''}">
      <div class="row">
        <div><span class="name">${esc(o.name || '(none)')}</span>${o.blocked ? '<span class="tag">Blocked</span>' : ''}<span class="tag t" data-until="${o.bannedUntil || 0}" data-blocked="${o.blocked ? 1 : 0}"></span>
          <div class="muted">Offenses: ${o.count || 0} · Last: ${o.lastAt ? new Date(o.lastAt).toLocaleString() : '-'} · Last timeout: ${o.lastMinutes || 0} min</div></div>
        <div class="acts">
          ${o.blocked ? `<button class="green" data-act="unblock" data-id="${esc(o.id)}">Unblock</button>` : `<button class="red" data-act="block" data-id="${esc(o.id)}">Block</button>`}
          <button data-act="reset" data-id="${esc(o.id)}">Reset timeout</button>
          <button data-act="del" data-id="${esc(o.id)}">Delete</button>
        </div>
      </div>
      <div class="msg">${esc(o.lastMessage || '')}</div>
      <details><summary>Device info</summary><div class="dev">
        Device ID: ${esc(o.id)}<br>Platform: ${esc(d.platform)} · Language: ${esc(d.lang)} · Timezone: ${esc(d.tz)}<br>
        Screen: ${esc(d.screen)} · Cores: ${esc(d.cores)} · Memory: ${esc(d.mem)} GB · Touch points: ${esc(d.touch)}<br>User agent: ${esc(d.ua)}
      </div></details></div>`;
  }).join('') : '<p class="muted">No offenders yet.</p>';
  tick();
}

function tick() {
  document.querySelectorAll('[data-until]').forEach(el => {
    const left = (+el.dataset.until) - Date.now();
    if (el.dataset.blocked === '1' || left <= 0) { el.hidden = true; return; }
    el.hidden = false; el.textContent = 'Timeout ' + fmtLeft(left);
  });
}
setInterval(tick, 1000);

document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const ref = db.ref('offenders/' + b.dataset.id);
  switch (b.dataset.act) {
    case 'block': ref.update({ blocked: true, blockedAt: Date.now() }); break;
    case 'unblock': ref.update({ blocked: false }); break;
    case 'reset': ref.update({ count: 0, bannedUntil: 0 }); break;
    case 'del': if (confirm('Delete this record? This also lifts any block.')) ref.remove(); break;
  }
});
</script></div></body></html>
